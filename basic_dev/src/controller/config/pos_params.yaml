# 水平控制 (XY轴)
kp_xy: 2.8
ki_xy: 0.0
kd_xy: 0.08
max_vel_xy: 24.0
max_integral_xy: 1.0

# 高度控制 (Z轴)
kp_z: 3.2
ki_z: 0.0
kd_z: 0.15
max_vel_z: 5.0
max_integral_z: 0.8

# 控制与接口参数
ctrl_rate_hz: 50.0
cmd_timeout: 0.3
xy_accel_limit: 8
max_yaw_rate: 2.5
rotate_max_yaw_rate: 0.35
yaw_kp_track: 2.5
yaw_kp_rotate: 0.45
yaw_rate_cmd_scale: 57.29577951308232
startup_profile_hold_dist: 0.0
startup_profile_blend_dist: 1.5

# 起步阶段控制器小参数，飞出一段距离后按距离平滑恢复上面的正常参数
startup_kp_xy: 2.6
startup_kd_xy: 0.08
startup_max_vel_xy: 18.0
startup_kp_z: 0.5
startup_kd_z: 0.12
startup_max_vel_z: 1.0

# 坐标系约定
# PositionCommand 和 /uav/state/pose 默认都按仿真 NED 处理；
# 控制器内部统一转成 z-up 后，再发送给 VelCmd.vz（上为正）。
position_cmd_z_sign: -1.0 
pose_z_sign: -1.0
